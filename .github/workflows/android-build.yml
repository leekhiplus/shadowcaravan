name: Android Build

# Builds a debug-signed, arm64-v8a APK of Shadow Caravan with Godot 4.3 and uploads it as a workflow artifact.
#   - Actions tab -> "Android Build" -> "Run workflow"  (manual), or
#   - any push to the main branch.
# No secrets are needed: the APK is signed with a throw-away debug keystore generated during the run.

on:
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: "Also run the headless gameplay smoke test (about 5 extra minutes)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_TAG: "4.3-stable"
  GODOT_TEMPLATES_DIR: "4.3.stable"
  GODOT_ZIP: "Godot_v4.3-stable_linux.x86_64.zip"
  GODOT_ZIP_SHA512: "fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a"
  GODOT_TPZ: "Godot_v4.3-stable_export_templates.tpz"
  GODOT_TPZ_SHA512: "476366caf0fd45a8f24136cf9cf1dc0bc2b96f7c82d53e5f82200b55aefd07b286d283fd6f1ce29e0de70648c5a51d3b12f96c6d4fafd4e8c4878ecda6406d6a"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"
  APK_PATH: "build/ShadowCaravan.apk"
  APP_PACKAGE: "com.zafronix.shadowcaravan"

jobs:
  build-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Godot download cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/godot-ci
          key: godot-${{ env.GODOT_TAG }}-linux-android-templates-v1

      - name: Install Godot 4.3 and Android export templates (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/godot-ci"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          mkdir -p "$CACHE/templates" "$TPL_DIR" "$HOME/bin"
          cd "$CACHE"

          if [ ! -f "$GODOT_ZIP" ]; then
            curl -fsSL --retry 5 --retry-delay 5 -o "$GODOT_ZIP" "$BASE/$GODOT_ZIP"
          fi
          echo "${GODOT_ZIP_SHA512}  ${GODOT_ZIP}" | sha512sum -c -

          if [ ! -f templates/android_debug.apk ] || [ ! -f templates/android_release.apk ] || [ ! -f templates/version.txt ]; then
            curl -fsSL --retry 5 --retry-delay 5 -o "$GODOT_TPZ" "$BASE/$GODOT_TPZ"
            echo "${GODOT_TPZ_SHA512}  ${GODOT_TPZ}" | sha512sum -c -
            unzip -j -o -q "$GODOT_TPZ" templates/android_debug.apk templates/android_release.apk templates/version.txt -d templates
            rm -f "$GODOT_TPZ"   # ~1 GB, keep it out of the cache
          fi
          test "$(cat templates/version.txt)" = "$GODOT_TEMPLATES_DIR"
          cp templates/android_debug.apk templates/android_release.apk templates/version.txt "$TPL_DIR/"

          rm -rf godot-bin && mkdir godot-bin
          unzip -o -q "$GODOT_ZIP" -d godot-bin
          install -m 755 "godot-bin/${GODOT_ZIP%.zip}" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/godot" --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK - run this workflow on a GitHub-hosted ubuntu runner."
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          yes | sudo -E env "PATH=$PATH" "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          sudo -E env "PATH=$PATH" "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}"
          test -x "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          echo "ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"

      - name: Create a debug keystore (nothing secret - generated fresh on every run)
        shell: bash
        run: |
          set -euo pipefail
          KS="$HOME/.local/share/godot/keystores/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          rm -f "$KS"
          "$JAVA_HOME/bin/keytool" -genkeypair -noprompt \
            -keyalg RSA -keysize 2048 -validity 9999 -deststoretype pkcs12 \
            -alias androiddebugkey -keypass android -storepass android \
            -keystore "$KS" -dname "CN=Android Debug,O=Android,C=US"
          test -s "$KS"
          echo "DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Point Godot at the SDK, JDK and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_PATH}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${DEBUG_KEYSTORE}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import
          test -d .godot/imported

      - name: Validate every script and scene (fails on any error)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s tests/validate.gd

      - name: Headless gameplay smoke test (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke_test }}
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s tests/smoke_playthrough.gd

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f "$APK_PATH"
          godot --headless --path . --export-debug "Android" "$APK_PATH" 2>&1 | tee build/export.log

      - name: Verify the APK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is missing or empty - the export failed."
            exit 1
          fi
          SIZE=$(stat -c %s "$APK_PATH")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::APK is suspiciously small ($SIZE bytes)."
            exit 1
          fi
          unzip -tq "$APK_PATH"
          # capture first: `grep -q` closing the pipe early would make `unzip` fail under pipefail
          LISTING="$(unzip -l "$APK_PATH")"
          MANIFEST_STRINGS="$(unzip -p "$APK_PATH" AndroidManifest.xml | strings -e l)"  # binary XML keeps its strings as UTF-16
          grep -q "AndroidManifest.xml" <<< "$LISTING"
          grep -q "lib/arm64-v8a/libgodot_android.so" <<< "$LISTING"
          grep -q "$APP_PACKAGE" <<< "$MANIFEST_STRINGS"
          BT="$ANDROID_SDK_PATH/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/apksigner" verify --verbose "$APK_PATH"
          # informational only: print what Android will see (package, SDK levels, ABI)
          BADGING="$("$BT/aapt2" dump badging "$APK_PATH" 2>&1 || true)"
          grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):" <<< "$BADGING" || true
          {
            echo "### Shadow Caravan debug APK"
            echo ""
            echo "- Size: $SIZE bytes"
            echo "- SHA-256: \`$(sha256sum "$APK_PATH" | cut -d' ' -f1)\`"
            echo "- Package: \`$APP_PACKAGE\`"
            echo "- ABI: arm64-v8a"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ShadowCaravan-debug-apk
          path: build/ShadowCaravan.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload export log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: export-log
          path: build/export.log
          if-no-files-found: ignore
          retention-days: 7
